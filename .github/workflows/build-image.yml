name: Build Borochi Pi-Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag-Name für das Release (z.B. v2.27.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write  # für GitHub Release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free up disk space
        # pi-gen braucht ~15-20 GB freien Platz. GitHub-Runner haben 14 GB frei.
        # Diese Action löscht .NET-SDK, Android-Tools, Haskell, Boost-Libs → +25 GB
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Show disk space
        run: df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout borochi-docs
        uses: actions/checkout@v4
        with:
          repository: digihonk/borochi-docs
          path: borochi-docs
        continue-on-error: true  # Image baut auch ohne Doku weiter (Fallback-Index.html)

      - name: Build offline docs site
        if: hashFiles('borochi-docs/mkdocs.yml') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f borochi-docs/requirements.txt ]; then
            pip install -r borochi-docs/requirements.txt
          else
            pip install mkdocs mkdocs-material pymdown-extensions
          fi
          DOCS_OUT="$(pwd)/stage-borochi/03-docs/files/opt/borochi/docs-site"
          rm -rf "$DOCS_OUT"
          mkdir -p "$DOCS_OUT"
          # NICHT --strict im Image-Build: Doku-Warnings dürfen das Image nicht killen
          mkdocs build -f borochi-docs/mkdocs.yml -d "$DOCS_OUT"
          echo "Built docs site: $(du -sh "$DOCS_OUT" | cut -f1)"

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pi-gen dependencies (native build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            quilt parted qemu-user-static debootstrap zerofree zip \
            dosfstools libarchive-tools libcap2-bin grep rsync \
            xz-utils file git curl bc qemu-utils kpartx pigz arch-test
          # binfmt_misc für arm-Emulation
          sudo update-binfmts --enable qemu-arm
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Prepare pi-gen workdir
        run: |
          # pi-gen erwartet Stages parallel zu seinem Repo
          cp -r stage-borochi pi-gen/
          cp config pi-gen/config
          echo "Stages: $(ls pi-gen | grep ^stage-)"

      - name: Build image (pi-gen native)
        working-directory: pi-gen
        run: |
          sudo CONTINUE=0 ./build.sh -c config

      - name: Locate output
        id: out
        working-directory: pi-gen
        run: |
          IMG=$(ls -t deploy/*.img.xz 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then
            echo "Kein Image gebaut! Inhalt deploy/:"
            ls -la deploy/ || true
            exit 1
          fi
          NEW="deploy/borochi-pi-${{ steps.tag.outputs.name }}.img.xz"
          mv "$IMG" "$NEW"
          # Hash für Verifikation
          sha256sum "$NEW" > "$NEW.sha256"
          echo "img=$NEW" >> "$GITHUB_OUTPUT"
          echo "sha=$NEW.sha256" >> "$GITHUB_OUTPUT"
          echo "Built: $NEW ($(stat -c%s "$NEW" | numfmt --to=iec))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: borochi-pi-${{ steps.tag.outputs.name }}
          path: |
            pi-gen/${{ steps.out.outputs.img }}
            pi-gen/${{ steps.out.outputs.sha }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Borochi Pi-Image ${{ steps.tag.outputs.name }}
          tag_name: ${{ steps.tag.outputs.name }}
          body: |
            Flashbares Raspberry-Pi-Image mit Borochi vorinstalliert.

            **Installation:**
            1. Raspberry Pi Imager → "Use Custom" → diese Datei
            2. SD-Karte rein, Pi booten
            3. Browser → http://borochi.local
            4. SSH: `ssh borochi@borochi.local` (default-PW `borochi`, ändern!)

            **Verifikation:**
            `sha256sum -c borochi-pi-*.img.xz.sha256`
          files: |
            pi-gen/${{ steps.out.outputs.img }}
            pi-gen/${{ steps.out.outputs.sha }}
          draft: false
          prerelease: false
