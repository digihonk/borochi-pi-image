name: Build Borochi Pi-Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag-Name für das Release (z.B. v2.27.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write  # für GitHub Release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup binfmt + QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare pi-gen workdir
        run: |
          # pi-gen erwartet Stages parallel zu seinem Repo
          cp -r stage-borochi pi-gen/
          cp config pi-gen/config
          # SKIP_IMAGES schaltet das Komprimieren in einzelnen Stages aus
          echo "Stages: $(ls pi-gen | grep ^stage-)"

      - name: Build image (pi-gen via Docker)
        working-directory: pi-gen
        run: |
          # pi-gen liefert build-docker.sh — nutzen wir.
          # CONTINUE=1 erlaubt Reruns, PRESERVE_CONTAINER für Cache
          CONTINUE=0 ./build-docker.sh -c config

      - name: Locate output
        id: out
        working-directory: pi-gen
        run: |
          IMG=$(ls -t deploy/*.img.xz 2>/dev/null | head -1)
          if [ -z "$IMG" ]; then
            echo "Kein Image gebaut! Inhalt deploy/:"
            ls -la deploy/ || true
            exit 1
          fi
          NEW="deploy/borochi-pi-${{ steps.tag.outputs.name }}.img.xz"
          mv "$IMG" "$NEW"
          # Hash für Verifikation
          sha256sum "$NEW" > "$NEW.sha256"
          echo "img=$NEW" >> "$GITHUB_OUTPUT"
          echo "sha=$NEW.sha256" >> "$GITHUB_OUTPUT"
          echo "Built: $NEW ($(stat -c%s "$NEW" | numfmt --to=iec))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: borochi-pi-${{ steps.tag.outputs.name }}
          path: |
            pi-gen/${{ steps.out.outputs.img }}
            pi-gen/${{ steps.out.outputs.sha }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Borochi Pi-Image ${{ steps.tag.outputs.name }}
          tag_name: ${{ steps.tag.outputs.name }}
          body: |
            Flashbares Raspberry-Pi-Image mit Borochi vorinstalliert.

            **Installation:**
            1. Raspberry Pi Imager → "Use Custom" → diese Datei
            2. SD-Karte rein, Pi booten
            3. Browser → http://borochi.local
            4. SSH: `ssh borochi@borochi.local` (default-PW `borochi`, ändern!)

            **Verifikation:**
            `sha256sum -c borochi-pi-*.img.xz.sha256`
          files: |
            pi-gen/${{ steps.out.outputs.img }}
            pi-gen/${{ steps.out.outputs.sha }}
          draft: false
          prerelease: false
