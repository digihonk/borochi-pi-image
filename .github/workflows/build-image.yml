name: Build Borochi Pi-Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag-Name für das Release (z.B. v2.27.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write  # für GitHub Release

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free up disk space
        # pi-gen braucht ~15-20 GB freien Platz. Standard-Runner hat 14 GB frei.
        # Diese Action löscht .NET-SDK, Android-Tools, Haskell, Boost → +25 GB
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Show disk space
        run: df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout borochi-docs (für Offline-Doku)
        uses: actions/checkout@v4
        with:
          repository: digihonk/borochi-docs
          path: borochi-docs
        continue-on-error: true

      - name: Build offline docs site
        if: hashFiles('borochi-docs/mkdocs.yml') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f borochi-docs/requirements.txt ]; then
            pip install -r borochi-docs/requirements.txt
          else
            pip install mkdocs mkdocs-material pymdown-extensions
          fi
          DOCS_OUT="$(pwd)/stage-borochi/03-docs/files/opt/borochi/docs-site"
          rm -rf "$DOCS_OUT"
          mkdir -p "$DOCS_OUT"
          mkdocs build -f borochi-docs/mkdocs.yml -d "$DOCS_OUT"
          echo "Built docs site: $(du -sh "$DOCS_OUT" | cut -f1)"

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Die offizielle pi-gen Community-Action — kümmert sich um QEMU, binfmt,
      # privileged Docker, loop-mounts. Das ist der zuverlässige Weg.
      - name: Build Pi image
        id: pi-gen
        uses: usimd/pi-gen-action@v1
        with:
          # Image-Basis
          image-name: borochi-pi
          release: bookworm
          # Unser Stage einhängen NACH stage2 (= Lite, ohne Desktop)
          stage-list: stage0 stage1 stage2 ./stage-borochi
          # System-Defaults
          hostname: borochi
          locale: de_DE.UTF-8
          keyboard-keymap: de
          keyboard-layout: German
          timezone: Europe/Berlin
          username: borochi
          password: borochi
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          # Kompression
          compression: xz
          compression-level: 6
          # Verbose damit wir sehen wo's hakt
          verbose-output: true

      - name: Rename and hash output
        id: out
        run: |
          IMG="${{ steps.pi-gen.outputs.image-path }}"
          if [ -z "$IMG" ] || [ ! -f "$IMG" ]; then
            echo "✗ Kein Image-Output von pi-gen-action!"
            ls -la deploy/ 2>/dev/null || true
            exit 1
          fi
          NEW_DIR=$(dirname "$IMG")
          NEW_NAME="borochi-pi-${{ steps.tag.outputs.name }}.img.xz"
          NEW="${NEW_DIR}/${NEW_NAME}"
          mv "$IMG" "$NEW"
          sha256sum "$NEW" > "${NEW}.sha256"
          echo "img=$NEW" >> "$GITHUB_OUTPUT"
          echo "sha=${NEW}.sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$NEW" "${NEW}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: borochi-pi-${{ steps.tag.outputs.name }}
          path: |
            ${{ steps.out.outputs.img }}
            ${{ steps.out.outputs.sha }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Borochi Pi-Image ${{ steps.tag.outputs.name }}
          tag_name: ${{ steps.tag.outputs.name }}
          body: |
            Flashbares Raspberry-Pi-Image mit Borochi vorinstalliert.

            **Installation:**
            1. Raspberry Pi Imager → "Use Custom" → diese Datei
            2. SD-Karte rein, Pi booten (~2 Min Firstboot)
            3. Browser → http://borochi.local
            4. SSH: `ssh borochi@borochi.local` (default-PW `borochi`, ändern!)
            5. Waveshare-IPs konfigurieren: `sudo borochi-setup`

            **Verifikation:**
            `shasum -a 256 -c borochi-pi-*.img.xz.sha256`

            **Doku:**
            - Online: https://digihonk.github.io/borochi-docs/
            - Offline auf dem Pi nach Boot: http://borochi.local:81

            Privates Reverse-Engineering von Marcel Ebbert — kein offizielles Borochi-Produkt.
          files: |
            ${{ steps.out.outputs.img }}
            ${{ steps.out.outputs.sha }}
          draft: false
          prerelease: false
